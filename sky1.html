<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale=1.0">
    <title>sky booker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!--available aopions for the suer-->
    <header>
    <div class="logo">
        <h1>SkyBooker</h1>
    </div>
    <nav>
        <ul>
            <li><a href="#">my booking</a></li>
            <li><a href="#">Technical support</a></li>
            <li><a href="#">English</a></li>
            <li><a href="#">offers</a></li>
        </ul>
    </nav>
    
</header>

<!-- thecodes that the user uses to search for booling -->
<div class="search-box">
    <div class="field">
        <label for="from">From</label>
        <input type="text" id="from" placeholder="Departure city">
    </div>
    <div class="field">
        <label for="to">To</label>
        <input type="text" id="to" placeholder="Arrival city">
    </div>
    <div class="field">
        <label for="depart">Depart</label>
        <input type="date" id="depart">
    </div>
    <div class="field">
        <label for="return">Return</label>
        <input type="date" id="return">
    </div>
    <button>Search</button>
</div>




</body>
</html>
